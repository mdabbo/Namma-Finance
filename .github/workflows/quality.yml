name: Quality gates

# Redesign and hardening branches carry the release work, so they must run the
# same gates as main. Pull requests always run, which is what makes a failing
# UI suite able to block a merge.
on:
  pull_request:
  push:
    branches: [main, "redesign/**", "hardening/**"]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: TypeScript and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-financial-coverage
          path: packages/core/coverage
          if-no-files-found: error
          retention-days: 30

  rust:
    name: Rust quality
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite drives Microsoft Edge (`channel: msedge`) because the app
      # ships in a Tauri WebView2 window. windows-latest already carries Edge
      # stable, so no browser binary is downloaded and there is nothing to
      # cache — this step only reconciles Playwright's channel registration.
      # It is allowed to fail: if Edge were genuinely unavailable the test run
      # below fails loudly rather than being masked here.
      - name: Register Edge channel
        continue-on-error: true
        working-directory: apps/desktop
        run: pnpm exec playwright install msedge

      - name: Run Playwright suite
        working-directory: apps/desktop
        run: pnpm exec playwright test

      # Uploaded on every run, pass or fail: the HTML report is the readable
      # evidence, test-results carries traces and failure screenshots.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-and-screenshots
          path: apps/desktop/test-results
          # Empty when every spec passes, which is not a failure.
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Desktop production build
    runs-on: windows-latest
    timeout-minutes: 60
    # The shippable artifact is only built once the gates that judge it pass.
    needs: [unit, rust, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # `vite build` alone produced a web bundle, not the thing users install.
      # A job named "Desktop production build" that never invoked cargo could
      # stay green through a Rust compile error, and the release evidence
      # recorded below would then attest to an artifact that was never built.
      # `tauri build` compiles the Rust binary and produces the installers.
      - name: Build desktop application
        shell: bash
        run: pnpm --filter @mep/desktop exec tauri build 2>&1 | tee build.log

      # The installers are the actual shippable output, so they are what gets
      # kept — not just the log that says a build happened.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' \) -exec cp {} dist-installers/ \;
          ls -l dist-installers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-installers
          path: dist-installers
          if-no-files-found: error
          retention-days: 30

      # Release evidence is worthless unless it names the exact commit it was
      # measured on, so the SHA and the run URL are recorded beside the log.
      #
      # Context values reach the shell through `env:`, never by `${{ }}`
      # interpolation into the script. A ref is attacker-chosen on a fork pull
      # request — a branch name may legally contain a double quote — and
      # interpolation would splice it into the command before bash ever parses
      # it. As environment variables they are only ever data.
      - name: Record release evidence
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo "commit_sha: ${COMMIT_SHA}"
            echo "ref: ${SOURCE_REF}"
            echo "run_url: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
            echo "run_attempt: ${RUN_ATTEMPT}"
          } > release-evidence.txt
          cat release-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-evidence
          path: |
            build.log
            release-evidence.txt
          if-no-files-found: warn
          retention-days: 30
